version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rfid-postgres
    environment:
      POSTGRES_USER: rfid_user
      POSTGRES_PASSWORD: rfid_password
      POSTGRES_DB: rfid_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfid_user -d rfid_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: rfid-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001" # WebSockets if needed
    volumes:
      - ./docker/mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
    container_name: rfid-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://rfid_user:rfid_password@postgres:5432/rfid_db
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    container_name: rfid-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000/ws/live
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  simulator:
    build:
      context: ./simulator
    container_name: rfid-simulator
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
    depends_on:
      mosquitto:
        condition: service_started
    volumes:
      - ./simulator:/app

volumes:
  postgres_data:
  mosquitto_data:
  mosquitto_log:
